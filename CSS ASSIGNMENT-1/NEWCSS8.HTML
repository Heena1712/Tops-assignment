<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Buttons</title>
    <style>
button {
    padding: 20px;
    border: none;
    border-radius: 8px;
    box-shadow: 2px 2px 5px;
    cursor: pointer;
    font-size: 16px;
     margin: 20px;
}

.b1 {
    background-color: #4e33af; 
}

.b2{
    background-color: #1767ad; 
}

.b3 {
    background-color: #cc4452; 
}  
  .b1:hover{
    background-color: aqua;
  }

  .b2:hover{
    background-color:green;
  }

  .b3:hover{
    background-color: yellow;
  }
    </style>
</head>
<body>
    <button class="b1">Primary</button>
    <button class="b2">Secondary</button>
    <button class="b3">Danger</button>
</body>
</html>
