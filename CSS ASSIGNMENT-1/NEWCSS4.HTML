<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Lists</title>
    
    <style>
        
        .li1 {
            list-style-type: none;
    padding-left: 0;
    list-style: square;
    padding-left: 20px; 
    color: rgb(170, 16, 75); 
    font-family: 'Arial', sans-serif; 
}


     .li2 {
    padding-left: 25px; 
    color: blue;
    font-family: 'Verdana', sans-serif;
    list-style: decimal;
}



    </style>
</head>
<body>
    <h1>My Adventure Tour Lists</h1>

    <div class="list">
        <h2>Unordered List</h2>
        <ul class="li1">
            <li>Motorcycle Tours</li>
            <li>River Rafting</li>
            <li>Scuba Diving</li>
        </ul>
    </div>

    <div class="list">
        <h2>Ordered List</h2>
        <ol class="li2">
            <li>Ladakh</li>
            <li>Rishikesh</li>
            <li>Andaman & Nicobar</li>
        </ol>
    </div>
</body>
</html>
